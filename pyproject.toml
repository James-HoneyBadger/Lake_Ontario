[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-ontario-ide"
version = "1.3.0"
description = "Standalone Lake Ontario BASIC IDE and interpreter package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "James HoneyBadger" }
]
requires-python = ">=3.11"
keywords = ["basic", "interpreter", "ide", "education", "satire"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Interpreters",
]

[project.scripts]
lake-ontario-ide = "lake_ontario_ide.gui:main"
lake-ontario-cli = "lake_ontario_ide.app:main"
lake-ontario-basic = "interpreter:main"

[project.urls]
Homepage = "https://github.com/James-HoneyBadger/Lake_Ontario"
Repository = "https://github.com/James-HoneyBadger/Lake_Ontario"
Issues = "https://github.com/James-HoneyBadger/Lake_Ontario/issues"

[tool.setuptools]
py-modules = ["interpreter", "ide", "run_ide"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lake_ontario_ide", "lake_ontario_ide.*"]

# Examples and the command reference are user-facing resources, not modules:
# install them where interpreter.resource_dir() / resource_file() can find them.
[tool.setuptools.data-files]
"share/lake-ontario-basic/examples" = ["examples/*.lo"]
"share/lake-ontario-basic" = [
  "COMMANDS.md",
  "README.md",
  "LICENSE",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
]
"share/lake-ontario-basic/docs" = ["docs/*.md"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["test_harness.py"]

# Note: flake8 does not read pyproject.toml; its configuration lives in .flake8.
