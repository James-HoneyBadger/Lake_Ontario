[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-ontario-ide"
version = "1.1.0"
description = "Standalone Lake Ontario BASIC IDE and interpreter package."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "James HoneyBadger" }
]
requires-python = ">=3.11"
keywords = ["basic", "interpreter", "ide", "education", "satire"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Interpreters",
]

[project.scripts]
lake-ontario-ide = "lake_ontario_ide.gui:main"
lake-ontario-cli = "lake_ontario_ide.app:main"
lake-ontario-basic = "interpreter:main"

[project.urls]
Homepage = "https://github.com/James-HoneyBadger/Lake_Ontario"
Repository = "https://github.com/James-HoneyBadger/Lake_Ontario"
Issues = "https://github.com/James-HoneyBadger/Lake_Ontario/issues"

[tool.setuptools]
py-modules = ["interpreter", "ide", "run_ide"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lake_ontario_ide", "lake_ontario_ide.*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E501"]
