[project]
name = "lake-ontario-ide"
version = "0.1.0"
description = "Standalone Lake Ontario BASIC IDE and interpreter package."
readme = "README.md"
authors = [
  { name = "James HoneyBadger" }
]
requires-python = ">=3.11"

[project.scripts]
lake-ontario-ide = "lake_ontario_ide.gui:main"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E501"]
