name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Lint
        run: python -m flake8 .

      - name: Compile
        run: python -m compileall -q .

      - name: Environment doctor
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            python interpreter.py --doctor --strict
          else
            echo "tkinter is unavailable here; running the doctor in tolerant mode."
            python interpreter.py --doctor
          fi

      - name: Validate every example
        run: |
          for script in examples/*.lo; do
            python interpreter.py --check "$script"
          done

      - name: Run the regression suite
        run: python tests.py

      - name: Run the same suite under pytest
        run: python -m pytest -q
