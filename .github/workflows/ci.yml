name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Lint
        run: python -m flake8 .

      - name: Compile
        run: python -m compileall -q .

      - name: Environment doctor
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            python interpreter.py --doctor --strict
          else
            echo "tkinter is unavailable here; running the doctor in tolerant mode."
            python interpreter.py --doctor
          fi

      - name: Validate every example
        run: |
          for script in examples/*.lo; do
            python interpreter.py --check "$script"
          done

      - name: Run the regression suite
        run: python tests.py

      - name: Run the same suite under pytest
        run: python -m pytest -q

  package:
    name: Package install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install dist/*.whl

      - name: The installed package must find its examples
        run: |
          /tmp/pkg-venv/bin/lake-ontario-basic --version
          /tmp/pkg-venv/bin/lake-ontario-basic --list-examples | tee /tmp/examples.txt
          grep -q "hello.lo" /tmp/examples.txt
          /tmp/pkg-venv/bin/lake-ontario-basic --run-example hello
          /tmp/pkg-venv/bin/lake-ontario-basic --doctor

      - name: Validate every packaged example from outside the checkout
        working-directory: /tmp
        run: |
          EXAMPLES=$(/tmp/pkg-venv/bin/python -c \
            "from interpreter import resource_dir; print(resource_dir('examples'))")
          echo "examples resolved to $EXAMPLES"
          case "$EXAMPLES" in
            */pkg-venv/share/*) ;;
            *) echo "expected the packaged copy, got $EXAMPLES"; exit 1 ;;
          esac
          for script in "$EXAMPLES"/*.lo; do
            /tmp/pkg-venv/bin/lake-ontario-basic --check "$script"
          done
          /tmp/pkg-venv/bin/lake-ontario-basic --max-steps 200000 --run-example coalition_case
